<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestionnaire de tâches</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!--Onglers-->
        <div class="tabs">
            <button class="tab">Notifications</button>
            <button class="tab active">ToDo</button>
        </div>

        <!--Liste des tâches-->
        <div class="task-list">
            <div class="task">
                <h3>Complete main UI components</h3>
                <p>Would be good if we include every component in  design system...</p>
                <span class="due">📅 Due: 6 April 2022</span>
                <span class="assigned">👤 Esther Helen</span>

            </div>

            <div class="task">
                <h3>Landing page design</h3>
                <span class="due">📅 Due: 10 April 2022</span>
                <span class="assigned">👤 Brooklyn Simmons</span>

            </div>

            <div class="task">
                <h3>Brand Guidelines</h3>
                <span class="due">📅 Due: 12 May 2022 </span>
                <span class="assigned">👤 Annette Bwemere</span>
            </div>

            <div class="task">
                <h3>Lerning FrontEnd</h3>
                <span class="Due">📅 Due: 20 May 2026</span>
                <span class="assigned">👤 Mob Dan</span>
            </div>
        </div>
        <div class="add-task">
            <input type="text" placeholder="Task name here...">
            <textarea placeholder="Description"></textarea>
            <div class="actions">
                <button>📅 Due Date</button>
                <button>👤 Assign To</button>
                <button class="cancel">Cancel</button>
                <button class="add">Add Task</button>
            </div>
        </div>
    </div>
</body>
</html>
